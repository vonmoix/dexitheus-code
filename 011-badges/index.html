<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exp. 011 · Badges</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@48,600,1,0&amp;icon_names=calendar_month,inventory_2,mail,notifications&amp;display=block">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <span class="dx-label">Exp. 011 · Badges</span>

  <main class="dx-stage">
    <div class="demo">
      <section class="demo__group">
        <h2 class="dx-meta">Click a button to clear its badge</h2>
        <div class="demo__row">
          <button type="button" class="icon-btn" data-label="Archive" data-count="4">
            <span class="icon" aria-hidden="true">inventory_2</span><span class="badge" aria-hidden="true"></span>
          </button>
          <button type="button" class="icon-btn" data-label="Calendar" data-count="2222222">
            <span class="icon" aria-hidden="true">calendar_month</span><span class="badge" aria-hidden="true"></span>
          </button>
          <button type="button" class="icon-btn" data-label="Notifications" data-count="5">
            <span class="icon" aria-hidden="true">notifications</span><span class="badge" aria-hidden="true"></span>
          </button>
          <button type="button" class="icon-btn" data-label="Mail" data-count="666666">
            <span class="icon" aria-hidden="true">mail</span><span class="badge" aria-hidden="true"></span>
          </button>
        </div>
        <button type="button" class="dx-btn reset">Reset badges</button>
      </section>
    </div>
  </main>

  <a class="dx-credit" href="https://dexitheus.ai" target="_blank" rel="noopener">dexitheus.ai</a>
  <script src="script.js"></script>
</body>
</html>
