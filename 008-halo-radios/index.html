<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exp. 008 · Halo radios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <span class="dx-label">Exp. 008 · Halo radios</span>

  <main class="dx-stage">
    <fieldset class="radios">
      <legend class="dx-meta">Design tool</legend>
      <div class="radios__list">
        <label class="radio" for="opt1">
          <input type="radio" name="tool" id="opt1" />
          <span class="label" aria-hidden="true"></span>Adobe
        </label>
        <label class="radio" for="opt2">
          <input type="radio" name="tool" id="opt2" />
          <span class="label" aria-hidden="true"></span>Figma
        </label>
        <label class="radio" for="opt3">
          <input type="radio" name="tool" id="opt3" />
          <span class="label" aria-hidden="true"></span>InVision
        </label>
        <label class="radio" for="opt4">
          <input type="radio" name="tool" id="opt4" />
          <span class="label" aria-hidden="true"></span>Sketch
        </label>
      </div>
    </fieldset>
  </main>

  <a class="dx-credit" href="https://dexitheus.ai" target="_blank" rel="noopener">dexitheus.ai</a>
</body>
</html>
