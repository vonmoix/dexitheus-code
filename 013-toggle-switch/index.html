<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exp. 013 · Toggle switch</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <span class="dx-label">Exp. 013 · Toggle switch</span>

  <main class="dx-stage">
    <label class="switch">
      <input type="checkbox" role="switch" id="switch">
      <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
      <span class="switch__text">
        <span class="switch__name">Dark mode</span>
        <span class="switch__state dx-meta" aria-hidden="true"></span>
      </span>
    </label>
  </main>

  <a class="dx-credit" href="https://dexitheus.ai" target="_blank" rel="noopener">dexitheus.ai</a>
</body>
</html>
